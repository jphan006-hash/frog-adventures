<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frog Adventure PRO+</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial;
}
canvas {
    display: block;
    margin: auto;
    background: #222;
    border: 3px solid lime;
}
#ui {
    position: absolute;
    top: 10px;
    left: 10px;
}
#colorPicker {
    position: absolute;
    top: 40px;
    left: 10px;
}
</style>
</head>
<body>

<div id="ui">Level: 1</div>
<input type="color" id="colorPicker" value="#00ff00">
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const colorPicker = document.getElementById("colorPicker");

let level = 1;
const maxLevel = 80;

// Frog
const frog = {
    x: 50,
    y: 400,
    size: 20,
    velY: 0,
    jumping: false,
    speed: 3,
    shield: false,
    color: colorPicker.value
};

const gravity = 0.5;

const goal = { x: 750, y: 420, size: 30 };

let enemies = [];
let powerUps = [];

// Color picker update
colorPicker.addEventListener("input", () => {
    frog.color = colorPicker.value;
});

// Sound
function beep(freq) {
    let ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctxAudio.createOscillator();
    osc.type = "square";
    osc.frequency.value = freq;
    osc.connect(ctxAudio.destination);
    osc.start();
    setTimeout(() => osc.stop(), 100);
}

// Level generator
function generateLevel() {
    enemies = [];
    powerUps = [];

    let enemyCount = Math.min(3 + level, 25);

    for (let i = 0; i < enemyCount; i++) {
        enemies.push({
            x: Math.random() * 700 + 50,
            y: Math.random() * 450,
            size: 20,
            speed: 1 + level * 0.05
        });
    }

    if (level % 3 === 0) {
        powerUps.push({
            x: Math.random() * 700,
            y: Math.random() * 400,
            type: Math.random() < 0.5 ? "speed" : "shield",
            size: 15
        });
    }

    frog.x = 50;
    frog.y = 400;
    frog.velY = 0;
    frog.shield = false;
}

generateLevel();

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Touch jump
canvas.addEventListener("touchstart", () => {
    if (!frog.jumping) {
        frog.velY = -10;
        frog.jumping = true;
        beep(400);
    }
});

// Collision
function collide(a, b) {
    return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
    );
}

// Update
function update() {
    if (keys["ArrowLeft"]) frog.x -= frog.speed;
    if (keys["ArrowRight"]) frog.x += frog.speed;

    if (keys[" "] && !frog.jumping) {
        frog.velY = -10;
        frog.jumping = true;
        beep(500);
    }

    frog.velY += gravity;
    frog.y += frog.velY;

    if (frog.y >= 400) {
        frog.y = 400;
        frog.jumping = false;
    }

    enemies.forEach(e => {
        let dx = frog.x - e.x;
        let dy = frog.y - e.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        e.x += (dx / dist) * e.speed;
        e.y += (dy / dist) * e.speed;

        if (collide(frog, e)) {
            if (frog.shield) {
                frog.shield = false;
            } else {
                level = 1;
                generateLevel();
                beep(100);
            }
        }
    });

    powerUps.forEach((p, i) => {
        if (collide(frog, p)) {
            if (p.type === "speed") frog.speed += 1;
            if (p.type === "shield") frog.shield = true;
            powerUps.splice(i, 1);
            beep(800);
        }
    });

    if (collide(frog, goal)) {
        level++;
        if (level > maxLevel) {
            alert("🏆 You beat all 80 levels!");
            level = 1;
        }
        generateLevel();
        beep(900);
    }

    frog.x = Math.max(0, Math.min(canvas.width - frog.size, frog.x));
}

// Draw
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Frog (custom color)
    ctx.fillStyle = frog.shield ? "cyan" : frog.color;
    ctx.fillRect(frog.x, frog.y, frog.size, frog.size);

    // Eyes
    ctx.fillStyle = "black";
    ctx.fillRect(frog.x+4, frog.y+4, 4, 4);
    ctx.fillRect(frog.x+12, frog.y+4, 4, 4);

    // Enemies
    ctx.fillStyle = "red";
    enemies.forEach(e => ctx.fillRect(e.x, e.y, e.size, e.size));

    // Goal
    ctx.fillStyle = "gold";
    ctx.fillRect(goal.x, goal.y, goal.size, goal.size);

    // Power-ups
    powerUps.forEach(p => {
        ctx.fillStyle = p.type === "speed" ? "blue" : "purple";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    ui.innerText = "Level: " + level + " / " + maxLevel;
}

// Loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
